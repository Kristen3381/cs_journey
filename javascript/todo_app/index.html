<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura's To-Do App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #2b2d42;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-section input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-section input:focus {
            border-color: #667eea;
        }

        .input-section button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .input-section button:hover {
            background: #764ba2;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #666;
        }

        .stats span { font-weight: bold; color: #2b2d42; }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: all 0.2s;
        }

        .task-item.done {
            border-left-color: #28a745;
            opacity: 0.7;
        }

        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .task-text {
            flex: 1;
            font-size: 15px;
            color: #2b2d42;
        }

        .task-item.done .task-text {
            text-decoration: line-through;
            color: #aaa;
        }

        .task-priority {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: bold;
        }

        .priority-high { background: #ffe0e0; color: #c0392b; }
        .priority-medium { background: #fff3cd; color: #856404; }
        .priority-low { background: #d4edda; color: #155724; }

        .delete-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            color: #e74c3c;
            background: #ffe0e0;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
        }

        .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }

        .clear-btn {
            width: 100%;
            padding: 10px;
            margin-top: 16px;
            background: none;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .priority-select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 My To-Do App</h1>
        <p class="subtitle">Stay productive, Laura!</p>

        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Add a new task..."
            >
            <select id="prioritySelect" class="priority-select">
                <option value="medium">🟡 Medium</option>
                <option value="high">🔴 High</option>
                <option value="low">🟢 Low</option>
            </select>
            <button onclick="addTask()">Add</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('all', this)">
                All
            </button>
            <button class="filter-btn" onclick="setFilter('active', this)">
                Active
            </button>
            <button class="filter-btn" onclick="setFilter('done', this)">
                Done
            </button>
        </div>

        <div class="stats">
            <div>Total: <span id="totalCount">0</span></div>
            <div>Active: <span id="activeCount">0</span></div>
            <div>Done: <span id="doneCount">0</span></div>
        </div>

        <div class="task-list" id="taskList"></div>

        <button class="clear-btn" onclick="clearCompleted()">
            🗑️ Clear completed tasks
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
